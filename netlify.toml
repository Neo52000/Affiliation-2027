# Configuration Netlify — site 100 % statique.

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fonction serverless de capture email (double opt-in) — section 12.
[functions]
  directory = "netlify/functions"

# En-têtes de sécurité sur tout le site.
# La CSP n'est PAS ici : Astro place en ligne de petits scripts (amorce des îlots,
# directives client:*), qu'un script-src 'self' bloquerait. Elle est générée après
# le build dans dist/_headers, avec l'empreinte sha256 de chaque script en ligne
# (scripts/generate-csp.ts, contrôlée par scripts/check-csp.ts).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Pages hors index : back office et pages d'état de la newsletter. L'en-tête
# double la balise meta noindex (robots.txt ne les bloque pas, pour qu'elle soit lue).
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/newsletter/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Assets fingerprintés par Astro : cache long immuable.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirections affiliées /go/{slug} : écrites dans dist/_redirects au postbuild
# (scripts/generate-redirects.ts) depuis src/data/affiliation.json, que le
# back office /admin édite. 302, exclues de robots.txt.
