name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Types (astro check)
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Tests unitaires
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Anti-duplication (Jaccard, pages métier)
        run: pnpm check:similarity

      - name: SEO (titles/descriptions uniques et bornés)
        run: pnpm check:seo

      - name: Installer Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Parcours Playwright
        run: pnpm test:e2e
